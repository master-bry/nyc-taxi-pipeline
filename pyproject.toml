[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-pipeline"
version = "1.0.0"
description = "End-to-end data engineering and ML pipeline for NYC taxi analytics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "NYC Taxi Pipeline", email = "dev@pipeline.local"}
]
keywords = ["data-engineering", "ml", "analytics", "duckdb", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Data Scientists",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.2.3",
    "requests==2.31.0",
    "tqdm==4.66.4",
    "python-dotenv==1.0.1",
    "dbt-duckdb>=1.8.1",
    "mlflow>=2.13.0",
    "scikit-learn>=1.5.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "streamlit>=1.35.0",
    "plotly>=5.24.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.7.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=6.1.0",
    "pylint>=3.0.0",
    "pre-commit>=3.5.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/master-bry/nyc-taxi-pipeline"
Repository = "https://github.com/master-bry/nyc-taxi-pipeline.git"
"Bug Tracker" = "https://github.com/master-bry/nyc-taxi-pipeline/issues"

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  | \.git
  | \.venv
  | build
  | dist
  | mlruns
  | \.eggs
  | \.mypy_cache
  | \.pytest_cache
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*", "*/venv/*"]
known_first_party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "duckdb.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mlflow.*"
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "C0330", # wrong hanging indentation before block
    "C0326", # bad whitespace
    "R0913", # too-many-arguments
    "R0914", # too-many-locals
]

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers --tb=short --cov=src --cov-report=html"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow running tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/site-packages/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
